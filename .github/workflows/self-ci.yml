name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: verify
    if: github.event_name == 'push'
    uses: $/.github/workflows/release-semantic.yml
    permissions:
      contents: write
