name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  verify:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
    permissions:
      contents: read

  release:
    needs: verify
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-semantic.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ syntax
    permissions:
      contents: write
